name: basic_locomotion_isaaclab_env
# Force ROS 2 to use localhost at startup for safety.
# This value can still be overridden after activating the environment.
variables:
  ROS_LOCALHOST_ONLY: "1"
channels:
- conda-forge
- nvidia
- robostack-staging
dependencies:
- pip
- python
- numpy
- cuda-nvcc 
- ros-humble-desktop
- ros-humble-rmw-cyclonedds-cpp
- ros-humble-rosidl-generator-dds-idl
- ros-humble-plotjuggler-ros
- ros-humble-librealsense2
- ros-humble-realsense2-camera-msgs
- ros-humble-realsense2-camera
- compilers 
- cmake 
- pkg-config 
- make 
- ninja 
- colcon-common-extensions 
- catkin_tools 
- rosdep
- tqdm
- gymnasium
- pip:
  - readchar
  - onnxruntime
  - torch
  - gym-quadruped