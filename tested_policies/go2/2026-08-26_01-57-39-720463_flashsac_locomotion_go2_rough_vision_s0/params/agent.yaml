task_name: Locomotion-Go2-Rough-Vision
class_name: OffPolicyRunner
seed: 0
device: cuda:0
num_steps_per_env: 1
max_iterations: 60000
save_interval: 60000
log_interval: 20
start_training: 0
experiment_name: flashsac_locomotion_go2_rough_vision
run_name: flashsac_locomotion_go2_rough_vision
logger:
  class_name: WandbLogWriter
  project_name: basic-locomotion
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: null
action_bound: scalar
action_bound_scale: 3.0
check_for_nan: true
actor:
  class_name: FlashSACActor
  num_blocks: 2
  hidden_dim: 128
  log_std_min: -10.0
  log_std_max: 2.0
critic:
  class_name: FlashSACCritic
  num_blocks: 3
  hidden_dim: 512
  num_bins: 101
  min_v: -5.0
  max_v: 5.0
algorithm:
  class_name: FlashSAC
  replay_buffer_size: 1000000
  buffer_min_length: 100000
  buffer_optimize_memory_usage: true
  buffer_device: cpu
  buffer_obs_dtype: null
  num_learning_epochs: 1
  num_mini_batches: 2
  mini_batch_size: 2048
  learning_rate_init: 0.0003
  learning_rate_peak: 0.0003
  learning_rate_end: 0.00015
  learning_rate_warmup_steps: 0
  learning_rate_decay_steps: null
  actor_bc_alpha: 0.0
  actor_noise_zeta_mu: 2.0
  actor_noise_zeta_max: 16
  actor_update_period: 2
  critic_target_update_tau: 0.01
  temp_initial_value: 0.1
  temp_target_sigma: 0.1
  temp_target_entropy: null
  gamma: 0.97
  n_steps: 1
  normalize_reward: true
  normalized_G_max: 5.0
  use_compile: true
  compile_mode: auto
  use_amp: true
  rnd_cfg: null
  symmetry_cfg: null
